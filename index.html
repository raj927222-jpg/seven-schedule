    <script>
      // Per AI Studio environment constraints: HMR is disabled, ignore WebSocket errors
      (function() {
        function isViteWsError(val) {
          if (!val) return false;
          var str = String(val.stack || val.message || val);
          return (
            str.includes('WebSocket') ||
            str.includes('@vite/client') ||
            str.includes('vite:ws') ||
            str.includes('closed without opened')
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event?.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (
            isViteWsError(event?.error) ||
            isViteWsError(event?.message) ||
            isViteWsError(event?.filename)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
